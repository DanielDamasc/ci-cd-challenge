services:
  laravel-app:
    # imagem e tag vêm do ambiente (exportados no script de deploy via SSH),
    # nunca fixas aqui — é assim que o cd.yml controla qual versão sobe
    image: '${DOCKERHUB_USERNAME}/laravel-app:${TAG}'
    environment:
      # sem .env dentro da imagem (ele é gitignored e nunca entra no build) — o Laravel
      # lê essas variáveis direto do ambiente do container, funciona igual a um .env
      APP_KEY: '${APP_KEY}'
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: db1
      DB_PORT: 3306
      DB_DATABASE: client1_db
      DB_USERNAME: root
      DB_PASSWORD: '${DB_PASSWORD}'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.koalapp.rule=Host(`cliente1.54.89.158.15.sslip.io`)"
      - "traefik.http.routers.koalapp.entrypoints=web"
      - "traefik.http.services.koalapp.loadbalancer.server.port=80"
    networks:
      - proxy-nw
      - client1-nw
    depends_on:
      - db1

  db1:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: client1_db
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - client1-nw

networks:
  proxy-nw:
    external: true
  client1-nw:
    external: true