services:
  laravel-app:
    # mesma imagem do cliente1 (mesma base de código) — cliente2 é só uma instância
    # isolada, com seu próprio banco, igual o CLAUDE.md descreve pro modelo multi-cliente
    image: '${DOCKERHUB_USERNAME}/laravel-app:${TAG}'
    environment:
      APP_KEY: '${APP_KEY_CLIENTE2}'
      CLIENT_NAME: cliente2
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: db2
      DB_PORT: 3306
      DB_DATABASE: client2_db
      DB_USERNAME: root
      DB_PASSWORD: '${DB_PASSWORD_CLIENTE2}'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cliente2app.rule=Host(`cliente2.54.89.158.15.sslip.io`)"
      - "traefik.http.routers.cliente2app.entrypoints=web"
      - "traefik.http.services.cliente2app.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-nw"
      # nomes de router/service diferentes do cliente1 (koalapp) — Traefik não
      # permite dois routers com o mesmo nome, mesmo em stacks/compose diferentes
    networks:
      - proxy-nw
      - client2-nw
    depends_on:
      db2:
        condition: service_healthy

  db2:
    image: mysql:8.4
    command: --innodb-buffer-pool-size=128M
    # mesmo limite aplicado no db1 — sem isso o MySQL tenta alocar buffer baseado
    # na RAM total da máquina, o que já causou OOM Kill com só 1 banco rodando
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD_CLIENTE2}'
      MYSQL_DATABASE: client2_db
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - client2-nw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
      # mesma config do db1 — ver comentário lá pro porquê de cada valor

networks:
  proxy-nw:
    external: true
  client2-nw:
    external: true
