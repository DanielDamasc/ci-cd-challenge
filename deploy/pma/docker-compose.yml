services:
  phpmyadmin:
    image: 'phpmyadmin/phpmyadmin:5.2'
    # "5.2-apache" nunca existiu nesse repositório (não existe sufixo "-apache").
    # A tag sem sufixo já é a variante com Apache embutido, servindo HTTP direto
    # (as variantes "fpm"/"fpm-alpine" são só FastCGI, sem servidor web, por isso
    # não podiam ser roteadas direto pelo Traefik)
    container_name: phpmyadmin
    environment:
      PMA_HOSTS: db1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma.rule=Host(`pma.cliente1.54.89.158.15.sslip.io`)"
      - "traefik.http.routers.pma.entrypoints=web"
      - "traefik.docker.network=proxy-nw"
      # mesma correção do cliente1: container tem 2 redes, sem essa label o Traefik
      # fica sem saber por qual delas alcançar o container
    networks:
      - proxy-nw
      - client1-nw
    restart: unless-stopped

networks:
  proxy-nw:
    external: true
  client1-nw:
    external: true