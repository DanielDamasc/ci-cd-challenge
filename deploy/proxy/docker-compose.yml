services:
  traefik:
    image: traefik:v2.11
    # v2.10 tentava falar com a API do Docker numa versão antiga (1.24), incompatível
    # com o Docker Engine instalado (29.9.3, mínimo exigido 1.40); a variável de
    # ambiente DOCKER_API_VERSION não é respeitada pelo provider Docker do Traefik,
    # então a correção real é essa: usar uma versão do Traefik com cliente Docker mais novo
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy-nw

networks:
  proxy-nw:
    external: true